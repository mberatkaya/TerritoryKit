name: Turkey dataset build

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Comma-separated ADM levels"
        required: true
        default: "ADM0,ADM1,ADM2"
      adm3_provinces:
        description: "Comma-separated Turkey province plate codes for ADM3 catalog ingestion"
        required: false
        default: ""
      adm3_catalog:
        description: "ADM3 source catalog path"
        required: false
        default: "datasets/sources/TR/adm3-catalog.json"
      allow_partial:
        description: "Allow partial ADM3 province coverage with ADM2 fallback metadata"
        required: true
        type: boolean
        default: false
      source_lock:
        description: "Existing source lock path, or empty to create one"
        required: false
        default: ""
      benchmark_baseline:
        description: "Benchmark baseline JSON path; leave empty to skip comparison"
        required: false
        default: "benchmarks/baselines/turkey-adm2-production.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @territory-kit/generators build
      - name: Create source lock
        if: ${{ inputs.source_lock == '' }}
        run: |
          mkdir -p dist/tr
          ADM3_FLAGS=""
          if [[ -n "${{ inputs.adm3_provinces }}" ]]; then
            ADM3_FLAGS="--adm3-provinces ${{ inputs.adm3_provinces }} --adm3-catalog ${{ inputs.adm3_catalog }}"
          fi
          pnpm --filter @territory-kit/cli exec territory country source lock TR \
            --levels "${{ inputs.levels }}" \
            --output dist/tr/sources.lock.json \
            $ADM3_FLAGS \
            --force \
            --json
      - name: Copy provided source lock
        if: ${{ inputs.source_lock != '' }}
        run: |
          mkdir -p dist/tr
          cp "${{ inputs.source_lock }}" dist/tr/sources.lock.json
      - name: Build Turkey artifacts
        run: |
          mkdir -p dist/tr
          PARTIAL_FLAGS=""
          if [[ "${{ inputs.allow_partial }}" == "true" ]]; then
            PARTIAL_FLAGS="--allow-partial"
          fi
          /usr/bin/time -v -o dist/tr/turkey-build-resource-report.txt \
            pnpm --filter @territory-kit/cli exec territory country build TR \
            --source-lock dist/tr/sources.lock.json \
            --levels "${{ inputs.levels }}" \
            --output dist/tr/artifact \
            --build-adjacency \
            --build-query-artifacts \
            --build-render-artifacts \
            --build-binary-index \
            --strict \
            --force \
            --profile \
            --profile-report dist/tr/artifact/build-performance-report.json \
            --phase-timeout-ms 300000 \
            $PARTIAL_FLAGS \
            --json
          cp dist/tr/turkey-build-resource-report.txt dist/tr/artifact/turkey-build-resource-report.txt
      - name: Validate artifact checksums
        run: pnpm --filter @territory-kit/cli exec territory country validate dist/tr/artifact --strict
      - name: Run Turkey ADM2 production benchmark
        run: |
          pnpm benchmark:run -- \
            --mode local-real \
            --dataset dist/tr/artifact/levels/ADM2/dataset.json \
            --scenario turkey-adm2-production \
            --iterations 5000 \
            --output dist/tr/artifact/turkey-adm2-benchmark.json
      - name: Compare Turkey ADM2 production benchmark
        if: ${{ inputs.benchmark_baseline != '' }}
        run: |
          pnpm benchmark:compare -- \
            --baseline "${{ inputs.benchmark_baseline }}" \
            --current dist/tr/artifact/turkey-adm2-benchmark.json
      - name: Summarize Turkey build evidence
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync, statSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const root = "dist/tr/artifact";
          const readJson = (path) => JSON.parse(readFileSync(join(root, path), "utf8"));
          const walk = (dir) =>
            readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const path = join(dir, entry.name);
              return entry.isDirectory() ? walk(path) : [path];
            });
          const files = walk(root);
          const mvtTiles = files.filter((path) => path.endsWith(".mvt"));
          const levels = Object.fromEntries(
            ["ADM0", "ADM1", "ADM2"]
              .map((level) => {
                const dataset = readJson(`levels/${level}/dataset.json`);
                return [level, dataset.zones.length];
              })
          );
          const summary = {
            schemaVersion: "territorykit-turkey-build-evidence@1",
            generatedAt: new Date().toISOString(),
            levels,
            totalSizeBytes: files.reduce((total, path) => total + statSync(path).size, 0),
            fileCount: files.length,
            mvtTileCount: mvtTiles.length,
            mvtTileTotalSizeBytes: mvtTiles.reduce((total, path) => total + statSync(path).size, 0),
            mvtLargestTileBytes: Math.max(0, ...mvtTiles.map((path) => statSync(path).size)),
            adjacency: {
              ADM1: readJson("adjacency/ADM1/build-report.json").statistics,
              ADM2: readJson("adjacency/ADM2/build-report.json").statistics
            },
            benchmark: readJson("turkey-adm2-benchmark.json"),
            resourceUsage: readFileSync(join(root, "turkey-build-resource-report.txt"), "utf8"),
            manifest: {
              sourceLockHash: readJson("manifest.json").sourceLockHash,
              publishReady: readJson("manifest.json").publishReady,
              publishReadyFailures: readJson("manifest.json").publishReadyFailures
            }
          };
          writeFileSync(join(root, "release-performance-summary.json"), `${JSON.stringify(summary, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v5
        with:
          name: turkey-build-performance-report
          path: |
            dist/tr/artifact/build-performance-report.json
            dist/tr/artifact/turkey-build-resource-report.txt
            dist/tr/artifact/turkey-adm2-benchmark.json
            dist/tr/artifact/release-performance-summary.json
      - uses: actions/upload-artifact@v5
        with:
          name: turkey-adjacency-report
          path: |
            dist/tr/artifact/adjacency-report.json
            dist/tr/artifact/adjacency/**/build-report.json
      - uses: actions/upload-artifact@v5
        with:
          name: turkey-mvt-policy-report
          path: dist/tr/artifact/render/mvt-policy-report.json
      - uses: actions/upload-artifact@v5
        with:
          name: turkey-coverage-checksum-reports
          path: |
            dist/tr/artifact/manifest.json
            dist/tr/artifact/checksums.json
            dist/tr/artifact/build-report.json
            dist/tr/sources.lock.json
