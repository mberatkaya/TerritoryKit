name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: matrix.node == 22
        run: pnpm release:check
      - if: matrix.node != 22
        run: pnpm verify
      - if: matrix.node == 24
        run: pnpm --filter @territory-kit/example-web-maplibre exec playwright install chromium --with-deps
      - if: matrix.node == 24
        run: pnpm test:visual:maplibre

  postgis-live:
    name: Live PostGIS validation
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: territorykit
          POSTGRES_USER: territorykit
          POSTGRES_PASSWORD: territorykit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U territorykit -d territorykit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm postgis:validate -- --output reports/postgis-live-validation.json
        env:
          TERRITORYKIT_POSTGIS_URL: postgresql://territorykit:territorykit@localhost:5432/territorykit
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: postgis-live-validation
          path: reports/postgis-live-validation.json
