name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: matrix.node == 22
        run: pnpm release:check
      - if: matrix.node != 22
        run: pnpm verify
      - if: matrix.node == 24
        run: pnpm --filter @territory-kit/example-web-maplibre exec playwright install chromium --with-deps
      - if: matrix.node == 24
        run: pnpm test:visual:maplibre

  postgis-live:
    name: Live PostGIS validation
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: territorykit
          POSTGRES_USER: territorykit
          POSTGRES_PASSWORD: territorykit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U territorykit -d territorykit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm postgis:validate -- --output reports/postgis-live-validation.json
        env:
          TERRITORYKIT_POSTGIS_URL: postgresql://territorykit:territorykit@localhost:5432/territorykit
      - uses: actions/upload-artifact@v5
        with:
          name: postgis-live-validation
          path: reports/postgis-live-validation.json
