version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - tsdown
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Remove this guard when deliberately migrating Changesets CLI to v3.
    ignore:
      - dependency-name: changesets/action
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - "*"
