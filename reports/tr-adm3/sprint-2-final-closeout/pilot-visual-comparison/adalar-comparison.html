                    [29.1405469, 40.8504697]
                  ]
                ]
              ]
            }
          }
        ]
      };
      const map = new maplibregl.Map({
        container: "map",
        style: "https://demotiles.maplibre.org/style.json",
        center: [29.096596252421705, 40.870896248012116],
        zoom: 11.5
      });
      map.on("load", () => {
        map.addSource("pilot", { type: "geojson", data });
        map.addLayer({
          id: "parent-outline",
          type: "line",
          filter: ["==", ["get", "layerClass"], "rc8-gameplay"],
          source: "pilot",
          paint: { "line-color": "#555", "line-width": 2 }
        });
        map.addLayer({
          id: "gameplay-fill",
          type: "fill",
          filter: [
            "all",
            ["==", ["get", "layerClass"], "rc8-gameplay"],
            ["has", "settlementIdentity"]
          ],
          source: "pilot",
          paint: { "fill-color": "#1a5fb4", "fill-opacity": 0.25 }
        });
        map.addLayer({
          id: "osm-fill",
          type: "fill",
          filter: ["==", ["get", "layerClass"], "osm-administrative-research-closeout"],
          source: "pilot",
          paint: {
            "fill-color": [
              "case",
              ["==", ["get", "qaOverlay"], "spatial-conflict"],
              "#c01c28",
              "#2ec27e"
            ],
            "fill-opacity": 0.35
          }
        });
        map.on("click", "osm-fill", (e) => {
          document.getElementById("detail").textContent = JSON.stringify(
            e.features[0].properties,
            null,
            2
          );
        });
      });
    </script>
  </body>
</html>
